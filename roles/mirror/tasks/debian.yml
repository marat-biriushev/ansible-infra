---
- name: Replace the base OS repositories with the mirror
  when: mirror_manage_os_repos | bool
  block:
    - name: Back up the original sources.list
      ansible.builtin.copy:
        src: /etc/apt/sources.list
        dest: /etc/apt/sources.list.before-ansible
        remote_src: true
        owner: root
        group: root
        mode: "0644"
        force: false

    - name: Deploy the mirror sources.list
      ansible.builtin.template:
        src: sources.list.j2
        dest: /etc/apt/sources.list
        owner: root
        group: root
        mode: "0644"
      notify: Refresh the apt metadata

    - name: Apply the new sources.list before any package is installed
      ansible.builtin.meta: flush_handlers
