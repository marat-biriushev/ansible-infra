---
- name: Replace the base OS repositories with the mirror
  when: mirror_manage_os_repos | bool
  block:
    # The mirror repository file is written first so the host never ends
    # up without any usable repository if the play is interrupted.
    - name: Deploy the mirror repository file
      ansible.builtin.template:
        src: mirror.repo.j2
        dest: /etc/yum.repos.d/00-mirror.repo
        owner: root
        group: root
        mode: "0644"

    - name: Find the repository files shipped with the distribution
      ansible.builtin.find:
        paths: /etc/yum.repos.d
        patterns: "*.repo"
        excludes: "00-mirror.repo,mirror-epel.repo,pgdg-mirror.repo"
      register: mirror_distro_repos

    - name: Disable the repository files shipped with the distribution
      ansible.builtin.command:
        cmd: "mv {{ item.path }} {{ item.path }}.disabled"
        creates: "{{ item.path }}.disabled"
      loop: "{{ mirror_distro_repos.files }}"
      loop_control:
        label: "{{ item.path }}"

- name: Deploy the EPEL repository file
  ansible.builtin.template:
    src: epel.repo.j2
    dest: /etc/yum.repos.d/mirror-epel.repo
    owner: root
    group: root
    mode: "0644"
  when: mirror_manage_epel | bool

- name: Refresh the dnf metadata
  ansible.builtin.command: dnf -q makecache
  changed_when: false
  when: mirror_manage_os_repos | bool or mirror_manage_epel | bool
