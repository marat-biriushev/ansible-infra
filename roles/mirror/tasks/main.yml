---
- name: Skip the mirror configuration when no mirror is defined
  ansible.builtin.meta: end_host
  when: mirror_base_url | length == 0

- name: Configure the RHEL repositories
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_os_family == 'RedHat'

- name: Configure the Debian repositories
  ansible.builtin.include_tasks: debian.yml
  when: ansible_os_family == 'Debian'

- name: Point pip at the mirror index
  ansible.builtin.template:
    src: pip.conf.j2
    dest: /etc/pip.conf
    owner: root
    group: root
    mode: "0644"
  when: mirror_manage_pip_config | bool
