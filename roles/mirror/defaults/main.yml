---
# ===================================================================
# Corporate package mirror.
#
# Everything this repository downloads (PGDG packages, the etcd release
# archive, Python wheels) is fetched from the mirror. The upstream URLs
# stay in the role defaults so the roles remain usable outside the bank
# network - the inventories point them at the mirror.
# ===================================================================
mirror_base_url: ""               # e.g. http://mirror.example.com - empty disables the role
mirror_host: "{{ mirror_base_url | regex_replace('^https?://([^/:]+).*$', '\\1') }}"

# Base OS repositories (BaseOS/AppStream on RHEL, sources.list on Debian).
# Off by default: machines usually already come from the mirror-aware
# image. Turn it on to have Ansible own the repository files.
mirror_manage_os_repos: false
mirror_rhel_baseos_url: "{{ mirror_base_url }}/rhel/$releasever/BaseOS/$basearch/os"
mirror_rhel_appstream_url: "{{ mirror_base_url }}/rhel/$releasever/AppStream/$basearch/os"
mirror_rhel_gpgkey: "{{ mirror_base_url }}/rhel/RPM-GPG-KEY-redhat-release"
mirror_rhel_gpgcheck: true

mirror_debian_url: "{{ mirror_base_url }}/debian"
mirror_debian_security_url: "{{ mirror_base_url }}/debian-security"
mirror_debian_components: "main contrib non-free non-free-firmware"

# EPEL is not required by the roles in this repository; enable it only
# if your own playbooks need packages from it.
mirror_manage_epel: false
mirror_epel_url: "{{ mirror_base_url }}/epel/$releasever/Everything/$basearch"
mirror_epel_gpgkey: "{{ mirror_base_url }}/epel/RPM-GPG-KEY-EPEL-$releasever"

# /etc/pip.conf changes pip for every user on the host, so it is off by
# default; the Patroni virtualenv gets the index through
# patroni_pip_extra_args instead, which touches nothing outside the venv.
mirror_manage_pip_config: false
mirror_pypi_index_url: "{{ mirror_base_url }}/pypi/simple"
