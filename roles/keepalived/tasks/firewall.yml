---
- name: Allow VRRP between the load balancers
  ansible.posix.firewalld:
    zone: "{{ common_firewalld_zone | default('public') }}"
    rich_rule: "rule family=ipv4 source address={{ item }} protocol value=vrrp accept"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ keepalived_firewall_sources }}"
