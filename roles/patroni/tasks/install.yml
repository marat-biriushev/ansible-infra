---
- name: Install the build prerequisites (Debian family)
  ansible.builtin.apt:
    name:
      - python3
      - python3-dev
      - python3-venv
      - python3-pip
      - gcc
      - libpq-dev
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == 'Debian'

- name: Install the build prerequisites (RedHat family)
  ansible.builtin.dnf:
    name:
      - python3
      - python3-devel
      - python3-pip
      - gcc
      - libpq-devel
    state: present
  when: ansible_os_family == 'RedHat'

- name: Create the Patroni virtualenv directory
  ansible.builtin.file:
    path: "{{ patroni_venv_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Patroni into a virtualenv
  ansible.builtin.pip:
    name: "{{ patroni_pip_packages }}"
    state: present
    virtualenv: "{{ patroni_venv_dir }}"
    virtualenv_command: "python3 -m venv"
  register: patroni_pip
  retries: 3
  delay: 5
  until: patroni_pip is succeeded
  notify: Restart patroni

- name: Read the installed Patroni version
  ansible.builtin.command: "{{ patroni_bin_dir }}/patroni --version"
  register: patroni_installed_version
  changed_when: false

- name: Assert that the installed Patroni is a 4.1.x release
  ansible.builtin.assert:
    that:
      - patroni_installed_version.stdout is search('patroni 4\\.1\\.')
    fail_msg: >-
      Expected a Patroni 4.1.x release, got "{{ patroni_installed_version.stdout }}"
    success_msg: "{{ patroni_installed_version.stdout }}"

- name: Link the Patroni entry points into /usr/local/bin
  ansible.builtin.file:
    src: "{{ patroni_bin_dir }}/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
  loop:
    - patroni
    - patronictl
