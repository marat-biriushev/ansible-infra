---
- name: Open the etcd client and peer ports for the cluster members
  ansible.posix.firewalld:
    zone: "{{ common_firewalld_zone | default('public') }}"
    rich_rule: >-
      rule family=ipv4 source address={{ item.0 }}
      port port={{ item.1 }} protocol=tcp accept
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ etcd_firewall_sources | product([etcd_client_port, etcd_peer_port]) | list }}"
  loop_control:
    label: "{{ item.0 }}:{{ item.1 }}"
