---
- name: Install HAProxy
  ansible.builtin.package:
    name: haproxy
    state: present
  register: haproxy_pkg
  retries: 3
  delay: 5
  until: haproxy_pkg is succeeded

- name: Allow binding to the non-local VIP address
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: "1"
    sysctl_file: /etc/sysctl.d/61-haproxy.conf
    sysctl_set: true
    state: present
    reload: true
  when: haproxy_ip_nonlocal_bind | bool

- name: Create the HAProxy runtime directory
  ansible.builtin.file:
    path: /run/haproxy
    state: directory
    owner: haproxy
    group: haproxy
    mode: "0755"

- name: Deploy the HAProxy configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: "{{ haproxy_conf_file }}"
    owner: root
    group: root
    mode: "0644"
    validate: "haproxy -c -f %s"
    backup: true
  notify: Reload haproxy

- name: Enable and start HAProxy
  ansible.builtin.service:
    name: haproxy
    state: started
    enabled: true
