---
- name: Open the HAProxy ports for the trusted networks
  ansible.posix.firewalld:
    zone: "{{ common_firewalld_zone | default('public') }}"
    rich_rule: >-
      rule family=ipv4 source address={{ item.0 }}
      port port={{ item.1 }} protocol=tcp accept
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ trusted_networks | product([haproxy_primary_port, haproxy_replica_port, haproxy_stats_port]) | list }}"
  loop_control:
    label: "{{ item.0 }}:{{ item.1 }}"
