---
common_timezone: Etc/UTC
common_manage_hosts_file: true
common_ntp_servers:
  - 0.pool.ntp.org
  - 1.pool.ntp.org

# firewalld (RHEL) is managed by every role that opens a port
manage_firewall: false
common_firewalld_zone: public

# The per-distribution lists live in vars/<os_family>.yml; add your own
# packages here instead of editing the base list.
common_extra_packages: []

common_sysctl:
  vm.swappiness: 1
  vm.overcommit_memory: 2
  vm.overcommit_ratio: 90
  net.ipv4.tcp_keepalive_time: 300
  net.ipv4.tcp_keepalive_intvl: 30
  net.ipv4.tcp_keepalive_probes: 5
  net.core.somaxconn: 4096
