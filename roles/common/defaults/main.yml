---
# The infrastructure team owns the OS baseline of these machines, so this
# role changes nothing. It only checks that the clock is disciplined:
# drift costs a Patroni lease, an etcd leader and a Kerberos ticket, and
# it is much cheaper to catch here than in the middle of a deployment.
common_verify_time_sync: true
common_time_sync_fail: true       # false turns the check into a warning
