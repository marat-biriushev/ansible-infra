---
# --- Patroni / PostgreSQL tuning for the TEST environment -----------
# The only baseline change the database stack asks for: PostgreSQL
# kernel tuning, written to /etc/sysctl.d/60-postgresql.conf (never to
# sysctl.conf). Agree it with the infrastructure team, or set it to
# false and let them apply the values from roles/postgresql/defaults.
postgresql_manage_sysctl: true

patroni_scope: "{{ pg_cluster_name }}"
patroni_namespace: /service
patroni_restapi_username: patroni

postgresql_max_connections: 200

# DCS-level cluster settings (stored in etcd, applied cluster-wide)
patroni_dcs:
  ttl: 30
  loop_wait: 10
  retry_timeout: 10
  maximum_lag_on_failover: 1048576
  synchronous_mode: false

# postgresql.conf parameters managed by Patroni
patroni_postgresql_parameters:
  max_connections: "{{ postgresql_max_connections }}"
  shared_buffers: 1GB
  effective_cache_size: 3GB
  maintenance_work_mem: 256MB
  work_mem: 8MB
  wal_level: replica
  hot_standby: "on"
  wal_log_hints: "on"
  max_wal_senders: 10
  max_replication_slots: 10
  wal_keep_size: 2GB
  checkpoint_completion_target: 0.9
  max_worker_processes: 8
  max_parallel_workers: 8
  max_parallel_workers_per_gather: 2
  random_page_cost: 1.1
  log_min_duration_statement: 1000
  log_checkpoints: "on"
  log_connections: "on"
  log_line_prefix: "%m [%p] %q%u@%d "
  shared_preload_libraries: pg_stat_statements
  track_io_timing: "on"
