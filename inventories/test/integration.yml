---
# ===================================================================
# Integration project - TEST environment
#   playmobile : application nodes running docker (RHEL 10)
#   patroni    : PostgreSQL 18 HA cluster (3 DB nodes + 2 load balancers)
# ===================================================================
all:
  children:

    # --- playmobile application nodes (docker) --------------------------
    playmobile:
      hosts:
        playm-tst-app01:
          ansible_host: 172.31.125.151
        playm-tst-app02:
          ansible_host: 172.31.125.152
        playm-tst-app03:
          ansible_host: 172.31.125.153
        playm-tst-app04:
          ansible_host: 172.31.125.154

    pg_cluster:
      children:
        patroni:
        etcd:
        haproxy:
        keepalived:

    # --- database nodes (addresses are still placeholders) --------------
    patroni:
      hosts:
        pg-test-db-01:
          ansible_host: 10.20.10.11
          patroni_node_name: pg-test-db-01
        pg-test-db-02:
          ansible_host: 10.20.10.12
          patroni_node_name: pg-test-db-02
        pg-test-db-03:
          ansible_host: 10.20.10.13
          patroni_node_name: pg-test-db-03

    # --- etcd runs on the same three VMs --------------------------------
    etcd:
      hosts:
        pg-test-db-01:
        pg-test-db-02:
        pg-test-db-03:

    # --- connection routing layer ---------------------------------------
    haproxy:
      hosts:
        pg-test-lb-01:
          ansible_host: 10.20.10.21
        pg-test-lb-02:
          ansible_host: 10.20.10.22

    keepalived:
      hosts:
        pg-test-lb-01:
          keepalived_priority: 150
          keepalived_state: MASTER
        pg-test-lb-02:
          keepalived_priority: 100
          keepalived_state: BACKUP
