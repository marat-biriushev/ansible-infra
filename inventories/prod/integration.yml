---
# ===================================================================
# Integration project - PROD environment
#   docker  : application nodes (RHEL 10)
#   patroni : PostgreSQL 18 HA cluster (3 DB nodes + 2 load balancers)
# ===================================================================
all:
  children:

    # --- application nodes running docker -------------------------------
    docker:
      hosts:
        admcn-prod-app01:
          ansible_host: 172.31.126.51
        admcn-prod-app02:
          ansible_host: 172.31.126.52
        admcn-prod-app03:
          ansible_host: 172.31.126.53
        admcn-prod-app04:
          ansible_host: 172.31.126.54
        admcn-prod-app05:
          ansible_host: 172.31.126.55
        admcn-prod-app06:
          ansible_host: 172.31.126.56

    pg_cluster:
      children:
        patroni:
        etcd:
        haproxy:
        keepalived:

    # --- database nodes (addresses are still placeholders) --------------
    patroni:
      hosts:
        pg-prod-db-01:
          ansible_host: 10.30.10.11
          patroni_node_name: pg-prod-db-01
        pg-prod-db-02:
          ansible_host: 10.30.10.12
          patroni_node_name: pg-prod-db-02
        pg-prod-db-03:
          ansible_host: 10.30.10.13
          patroni_node_name: pg-prod-db-03

    # --- etcd runs on the same three VMs --------------------------------
    etcd:
      hosts:
        pg-prod-db-01:
        pg-prod-db-02:
        pg-prod-db-03:

    # --- connection routing layer ---------------------------------------
    haproxy:
      hosts:
        pg-prod-lb-01:
          ansible_host: 10.30.10.21
        pg-prod-lb-02:
          ansible_host: 10.30.10.22

    keepalived:
      hosts:
        pg-prod-lb-01:
          keepalived_priority: 150
          keepalived_state: MASTER
        pg-prod-lb-02:
          keepalived_priority: 100
          keepalived_state: BACKUP
