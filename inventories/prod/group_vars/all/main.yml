---
# ===================================================================
# Global variables - PRODUCTION environment
# ===================================================================
env_name: prod
env_is_production: true

# --- cluster identity ----------------------------------------------
pg_cluster_name: pg-prod
pg_cluster_domain: prod.local

# --- OS baseline ----------------------------------------------------
# The infrastructure team owns the baseline of these machines (time
# source, kernel parameters, /etc/hosts, the base package set), so the
# common role changes none of it. Each area can be switched on per group
# where a stack really needs it - see group_vars/patroni.yml.
common_verify_time_sync: true     # read-only check, changes nothing
manage_firewall: true             # firewalld rules are managed by the roles

# --- corporate mirror -------------------------------------------------
# Everything the playbooks download comes from here: PGDG packages, the
# etcd release archive and the Python wheels for the Patroni virtualenv.
mirror_base_url: "http://mirror.ipotekabank.uz"

# Base OS repositories. The VMs normally already point at the mirror, so
# Ansible does not touch BaseOS/AppStream (or sources.list) unless asked.
mirror_manage_os_repos: false
mirror_manage_epel: false

# The /repos/<name>/ layout is confirmed for docker; the other paths
# follow the same convention - check them against the mirror and adjust
# here (the roles themselves need no change).
docker_repo_baseurl: "{{ mirror_base_url }}/repos/docker/"

postgresql_pgdg_rhel_baseurl: >-
  {{ mirror_base_url }}/repos/pgdg/{{ postgresql_version }}/redhat/rhel-$releasever-$basearch
postgresql_pgdg_rhel_gpgkey: "{{ mirror_base_url }}/repos/pgdg/keys/PGDG-RPM-GPG-KEY-RHEL"
postgresql_pgdg_repo_url: "{{ mirror_base_url }}/repos/pgdg-apt"
postgresql_pgdg_key_url: "{{ mirror_base_url }}/repos/pgdg-apt/ACCC4CF8.asc"

# etcd release archives: <base>/v<version>/etcd-v<version>-linux-amd64.tar.gz
etcd_download_base_url: "{{ mirror_base_url }}/repos/etcd"

# Python wheels for the Patroni virtualenv. Passed to pip for that venv
# only - /etc/pip.conf is left to the infrastructure team.
mirror_pypi_index_url: "{{ mirror_base_url }}/pypi/simple"
mirror_pypi_trusted_host: "mirror.ipotekabank.uz"
patroni_pip_extra_args: >-
  --index-url {{ mirror_pypi_index_url }}
  --trusted-host {{ mirror_pypi_trusted_host }}

# --- access (FreeIPA) -------------------------------------------------
# The hosts are enrolled in IPA, so SSH authentication goes through
# Kerberos (GSSAPI) and the sudo rule comes from IPA as well.
# ansible.cfg already passes -o GSSAPIAuthentication=yes.
#
# ansible_user: svc-ansible          # the IPA account the runner uses
#
# If the IPA sudo rule for that account is not NOPASSWD, a CI job cannot
# answer the prompt - either ask for a NOPASSWD rule on these host
# groups, or put the password in the vault:
# ansible_become_password: "{{ vault_become_password }}"
#
# IPA publishes SSHFP records, so host keys can be verified from DNS
# instead of a known_hosts file:
# ansible_ssh_common_args: "-o VerifyHostKeyDNS=yes"

# --- networking -----------------------------------------------------
trusted_networks:
  - 10.30.10.0/24
  - 10.30.20.0/24
  - 172.31.126.0/24

cluster_interface: eth0

# --- versions (single source of truth) -------------------------------
postgresql_version: 18
patroni_version: "4.1.*"
etcd_version: "3.5.17"

# --- cluster-wide ports -----------------------------------------------
# Defined for every host: the database nodes listen on them and the load
# balancers use the same values for their backends and health checks.
postgresql_port: 5432
patroni_restapi_port: 8008

# --- credentials (see vault.yml.example) ------------------------------
postgresql_superuser_password: "{{ vault_postgresql_superuser_password }}"
postgresql_replication_password: "{{ vault_postgresql_replication_password }}"
postgresql_rewind_password: "{{ vault_postgresql_rewind_password }}"
patroni_restapi_password: "{{ vault_patroni_restapi_password }}"
haproxy_stats_password: "{{ vault_haproxy_stats_password }}"
keepalived_auth_pass: "{{ vault_keepalived_auth_pass }}"
