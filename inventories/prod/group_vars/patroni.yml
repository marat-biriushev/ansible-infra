---
# --- Patroni / PostgreSQL tuning for the PRODUCTION environment -----
# The only baseline change the database stack asks for: PostgreSQL
# kernel tuning, written to /etc/sysctl.d/60-postgresql.conf (never to
# sysctl.conf). Agree it with the infrastructure team, or set it to
# false and let them apply the values from roles/postgresql/defaults.
postgresql_manage_sysctl: true

patroni_scope: "{{ pg_cluster_name }}"
patroni_namespace: /service
patroni_restapi_username: patroni

postgresql_max_connections: 500

# DCS-level cluster settings (stored in etcd, applied cluster-wide).
# synchronous_mode guarantees zero data loss on failover.
patroni_dcs:
  ttl: 30
  loop_wait: 10
  retry_timeout: 10
  maximum_lag_on_failover: 1048576
  synchronous_mode: true
  synchronous_node_count: 1

patroni_postgresql_parameters:
  max_connections: "{{ postgresql_max_connections }}"
  shared_buffers: 8GB
  effective_cache_size: 24GB
  maintenance_work_mem: 1GB
  work_mem: 16MB
  wal_level: replica
  hot_standby: "on"
  wal_log_hints: "on"
  max_wal_senders: 16
  max_replication_slots: 16
  wal_keep_size: 8GB
  max_wal_size: 16GB
  min_wal_size: 2GB
  checkpoint_completion_target: 0.9
  max_worker_processes: 16
  max_parallel_workers: 16
  max_parallel_workers_per_gather: 4
  random_page_cost: 1.1
  effective_io_concurrency: 200
  log_min_duration_statement: 500
  log_checkpoints: "on"
  log_connections: "on"
  log_lock_waits: "on"
  log_temp_files: "0"
  log_line_prefix: "%m [%p] %q%u@%d "
  shared_preload_libraries: pg_stat_statements
  track_io_timing: "on"
  password_encryption: scram-sha-256
