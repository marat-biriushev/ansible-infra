[defaults]
inventory            = inventories/test
roles_path           = roles:galaxy_roles
collections_path     = collections
# On IPA-enrolled hosts the SSHFP records are in IPA DNS, so this can be
# turned on together with -o VerifyHostKeyDNS=yes (see README).
host_key_checking    = False
retry_files_enabled  = False
stdout_callback      = yaml
bin_ansible_callbacks = True
callbacks_enabled    = profile_tasks, timer
interpreter_python   = auto_silent
forks                = 20
timeout              = 30
display_skipped_hosts = False
# vault_password_file  = .vault_pass   # or: export ANSIBLE_VAULT_PASSWORD_FILE=.vault_pass
nocows               = 1

# In a closed network galaxy.ansible.com is unreachable: point this at
# the internal Galaxy proxy (Nexus can serve one) and run
#   ansible-galaxy collection install -r requirements.yml
# Alternatively pass -s <url> on the command line, or vendor the
# collection tarballs and install them from a local path.
# [galaxy_server.internal]
# url = http://nexus.otp.ipotekabank.uz/repository/ansible-galaxy/
#
# [galaxy]
# server_list = internal

[inventory]
enable_plugins = yaml, ini, host_list, script, auto

[ssh_connection]
pipelining   = True
# GSSAPI stays enabled so a Kerberos ticket from FreeIPA is used when
# there is one; OpenSSH falls back to the key when there is not. Do not
# put PreferredAuthentications=publickey back - it disables Kerberos.
ssh_args     = -o ControlMaster=auto -o ControlPersist=900s -o ServerAliveInterval=30 -o GSSAPIAuthentication=yes -o GSSAPIDelegateCredentials=no
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
# The sudo rule comes from IPA. If it is not NOPASSWD, supply
# ansible_become_password from the vault instead of turning this on -
# a CI job cannot answer a prompt.
become_ask_pass = False
