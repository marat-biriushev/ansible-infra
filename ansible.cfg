[defaults]
inventory            = inventories/test
roles_path           = roles:galaxy_roles
collections_path     = collections
host_key_checking    = False
retry_files_enabled  = False
stdout_callback      = yaml
bin_ansible_callbacks = True
callbacks_enabled    = profile_tasks, timer
interpreter_python   = auto_silent
forks                = 20
timeout              = 30
display_skipped_hosts = False
# vault_password_file  = .vault_pass   # or: export ANSIBLE_VAULT_PASSWORD_FILE=.vault_pass
nocows               = 1

# In a closed network galaxy.ansible.com is unreachable: point this at
# the internal Galaxy proxy (Nexus can serve one) and run
#   ansible-galaxy collection install -r requirements.yml
# Alternatively pass -s <url> on the command line, or vendor the
# collection tarballs and install them from a local path.
# [galaxy_server.internal]
# url = http://nexus.otp.ipotekabank.uz/repository/ansible-galaxy/
#
# [galaxy]
# server_list = internal

[inventory]
enable_plugins = yaml, ini, host_list, script, auto

[ssh_connection]
pipelining   = True
ssh_args     = -o ControlMaster=auto -o ControlPersist=900s -o PreferredAuthentications=publickey
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
become_ask_pass = False
