---
# ===================================================================
# Docker CE on the application nodes.
#
#   ansible-playbook -i inventories/dev  playbooks/docker.yml
#   ansible-playbook -i inventories/prod playbooks/docker.yml --limit admcn-prod-app01
# ===================================================================
- name: Docker application nodes
  hosts: docker
  gather_facts: true
  tags: [docker]
  roles:
    - role: mirror
      tags: [mirror]
    - role: common
      tags: [common]
    - role: docker
