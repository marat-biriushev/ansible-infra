---
# ===================================================================
# Pipeline for the internal GitLab.
#
#   lint/verify : run automatically on every push
#   deploy      : manual jobs - pick the inventory, the playbook, the
#                 --limit and the tags in the "Run pipeline" form
#
# Nothing here reaches the internet: the runner image, the pip index and
# the Galaxy proxy all come from the mirror/Nexus. Override the values
# in Settings -> CI/CD -> Variables if the paths differ.
# ===================================================================
variables:
  ANSIBLE_IMAGE:
    value: "docker-proxy.nexus.otp.ipotekabank.uz/python:3.12-slim"
    description: "Runner image (an image with ansible-core and openssh preinstalled is faster)"
  PIP_INDEX_URL: "http://mirror.ipotekabank.uz/pypi/simple"
  PIP_TRUSTED_HOST: "mirror.ipotekabank.uz"
  GALAXY_SERVER_URL:
    value: ""
    description: "Internal ansible-galaxy proxy; empty skips the collection install"

  # --- the deploy form ------------------------------------------------
  ENVIRONMENT:
    value: "test"
    options: ["dev", "test", "prod"]
    description: "Inventory to act on"
  PLAYBOOK:
    value: "playbooks/playmobile.yml"
    options:
      - "playbooks/playmobile.yml"
      - "playbooks/patroni_cluster.yml"
      - "playbooks/patroni_status.yml"
      - "playbooks/patroni_switchover.yml"
      - "playbooks/patroni_rolling_restart.yml"
      - "playbooks/site.yml"
    description: "Playbook to run"
  LIMIT:
    value: ""
    description: "--limit pattern, e.g. playm-prd-01 or playmobile"
  TAGS:
    value: ""
    description: "--tags, e.g. docker or patroni_config"
  EXTRA_VARS:
    value: ""
    description: "-e values, e.g. candidate=pg-prod-db-02"

  ANSIBLE_FORCE_COLOR: "1"
  # Kerberos ticket lives in the job workspace and dies with it
  KRB5CCNAME: "FILE:$CI_PROJECT_DIR/.krb5cc"

stages:
  - lint
  - verify
  - deploy

# -------------------------------------------------------------------
.ansible:
  image: "$ANSIBLE_IMAGE"
  before_script:
    - command -v ansible-playbook >/dev/null || pip install --quiet "ansible-core>=2.15"
    - |
      if [ -n "$GALAXY_SERVER_URL" ]; then
        ansible-galaxy collection install -r requirements.yml -s "$GALAXY_SERVER_URL"
      fi

.ansible-ssh:
  extends: .ansible
  before_script:
    - command -v ansible-playbook >/dev/null || pip install --quiet "ansible-core>=2.15"
    - |
      if [ -n "$GALAXY_SERVER_URL" ]; then
        ansible-galaxy collection install -r requirements.yml -s "$GALAXY_SERVER_URL"
      fi
    # Kerberos (FreeIPA) when KRB5_KEYTAB is set, an ssh key otherwise.
    # Sourced, so the ticket cache and the agent socket reach the job.
    - . ci/setup-auth.sh
    # ANSIBLE_VAULT_PASSWORD_FILE is a file-type CI variable; ansible
    # picks it up from the environment on its own.
    #
    # The form fields are turned into arguments by ci/run-ansible.sh,
    # which validates them and keeps a value with spaces in one argument.
  variables:
    ANSIBLE_LOG_PATH: "ansible.log"

# --- automatic checks ------------------------------------------------
yamllint:
  stage: lint
  extends: .ansible
  before_script:
    - pip install --quiet yamllint
  script:
    - yamllint .

ansible-lint:
  stage: lint
  extends: .ansible
  before_script:
    - pip install --quiet "ansible-core>=2.15" ansible-lint
    - |
      if [ -n "$GALAXY_SERVER_URL" ]; then
        ansible-galaxy collection install -r requirements.yml -s "$GALAXY_SERVER_URL"
      fi
  script:
    - ansible-lint

syntax:
  stage: verify
  extends: .ansible
  script:
    - |
      for env in dev test prod; do
        echo "== $env"
        ansible-playbook -i "inventories/$env" playbooks/site.yml --syntax-check
      done

# --- manual runs -----------------------------------------------------
ping:
  stage: deploy
  extends: .ansible-ssh
  when: manual
  allow_failure: true
  script:
    - ci/run-ansible.sh ping

dry-run:
  stage: deploy
  extends: .ansible-ssh
  when: manual
  allow_failure: true
  script:
    - ci/run-ansible.sh check

# One deployment at a time per environment: two concurrent runs against
# the same Patroni cluster would fight over the leader.
run:
  stage: deploy
  extends: .ansible-ssh
  allow_failure: false
  interruptible: false
  resource_group: "$ENVIRONMENT"
  environment:
    name: "$ENVIRONMENT"
  rules:
    # prod is deployed from the default branch only
    - if: '$ENVIRONMENT == "prod" && $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH'
      when: never
    - when: manual
  script:
    - ci/run-ansible.sh apply
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - ansible.log
